name: Electron

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: macos
          - os: windows-latest
            script: build:win
            artifact: windows
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cave-paintings-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            out/*.dmg
            out/*-mac.zip
            out/*Setup*.exe
            out/*-win.zip
            out/*.AppImage
            out/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*Setup*.exe
            dist/*.AppImage
            dist/*-mac.zip
            dist/*-win.zip
            dist/*.tar.gz
          generate_release_notes: true
